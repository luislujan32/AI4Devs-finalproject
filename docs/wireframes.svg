<text x="1259" y="419" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#824817">Motivo: licencia excluyente incumplida</text>
<text x="1244" y="519" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#273449">82,2 / 100</text>
<text x="1506" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#617087">Umbral: 70</text>
<text x="1244" y="571" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#273449">Evidencia y aportes</text>
<text x="1244" y="610" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#273449">Inglés declarado</text>
<text x="1244" y="636" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#617087">100 × peso 5 = 500</text>
<path d="M 1244 647 h 484" stroke="#DFE5EC"/>
<text x="1244" y="672" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#273449">Experiencia comercial</text>
<text x="1244" y="698" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#617087">80 × peso 3 = 240</text>
<path d="M 1244 709 h 484" stroke="#DFE5EC"/>
<text x="1244" y="734" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#273449">Licencia: No</text>
<text x="1244" y="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#617087">0 × peso 1 = 0 · no cumple</text>
<path d="M 1244 771 h 484" stroke="#DFE5EC"/>
<text x="1244" y="818" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#273449">Revisión del recruiter</text>
<rect x="1244" y="833" width="484" height="43" rx="12" fill="#F9FAFC" stroke="#D8DFE8" stroke-width="2"/>
<text x="1256" y="861" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#273449">Continuar</text>
<rect x="1244" y="887" width="484" height="69" rx="12" fill="#F9FAFC" stroke="#D8DFE8" stroke-width="2"/>
<text x="1256" y="911" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#617087">Motivo obligatorio:</text>
<text x="1256" y="941" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#273449">Perfil prometedor; revisar el requisito.</text>
<rect x="1460" y="980" width="268" height="44" rx="8" fill="#263E61" stroke="#263E61" stroke-width="2"/>
<text x="1476" y="1006" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Guardar revisión</text>
<text x="48" y="1120" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#617087">Las respuestas son declaraciones del candidato. El informe no certifica competencias ni ejecuta decisiones externas.</text>
