<text x="84" y="837" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#617087">Peso 1 · Sí: 100 / No: 0 · excluyente</text>
<text x="72" y="898" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#273449">Umbral para superar: 70 / 100</text>
<text x="72" y="930" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#617087">Al publicar se congelan las preguntas y las</text>
<text x="72" y="957" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#617087">reglas de evaluación.</text>
<rect x="72" y="987" width="208" height="44" rx="8" fill="#FFFFFF" stroke="#CAD3E0" stroke-width="2"/>
<text x="88" y="1013" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#273449">Guardar borrador</text>
