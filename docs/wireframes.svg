<text x="84" y="747" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#617087">Peso 3 · opciones: 0 / 40 / 80 / 100</text>
<rect x="72" y="778" width="484" height="77" rx="12" fill="#F9FAFC" stroke="#D8DFE8" stroke-width="2"/>
