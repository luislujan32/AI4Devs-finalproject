<text x="658" y="435" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#273449">vigente?</text>
<rect x="658" y="488" width="484" height="54" rx="9" fill="#FFFFFF" stroke="#D8DFE8" stroke-width="2"/>
<rect x="673" y="505" width="20" height="20" rx="10" fill="#FFFFFF" stroke="#627F9D" stroke-width="2"/>
<text x="710" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#273449">Sí</text>
<rect x="658" y="557" width="484" height="54" rx="9" fill="#ECF1F8" stroke="#627F9D" stroke-width="2"/>
<rect x="673" y="574" width="20" height="20" rx="10" fill="#263E61" stroke="#627F9D" stroke-width="2"/>
<text x="710" y="589" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#273449">No</text>
<rect x="658" y="626" width="484" height="54" rx="9" fill="#FFFFFF" stroke="#D8DFE8" stroke-width="2"/>
<rect x="673" y="643" width="20" height="20" rx="10" fill="#FFFFFF" stroke="#627F9D" stroke-width="2"/>
<text x="710" y="658" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#273449">No puedo confirmarlo</text>
<text x="658" y="741" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#466453">Guardado</text>
<text x="658" y="786" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#617087">Podés revisar tus respuestas antes del</text>
<text x="658" y="813" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#617087">envío final.</text>
<rect x="658" y="863" width="159" height="44" rx="8" fill="#FFFFFF" stroke="#CAD3E0" stroke-width="2"/>
<text x="674" y="889" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#273449">Anterior</text>
<rect x="834" y="863" width="308" height="44" rx="8" fill="#263E61" stroke="#263E61" stroke-width="2"/>
<text x="850" y="889" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Revisar respuestas</text>
<rect x="658" y="925" width="250" height="44" rx="8" fill="#FFFFFF" stroke="#CAD3E0" stroke-width="2"/>
<text x="674" y="951" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#273449">Guardar y salir</text>
<text x="658" y="1008" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#617087">Tu respuesta no interrumpe el cuestionario.</text>
<text x="1244" y="277" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#273449">Informe del candidato</text>
<text x="1244" y="315" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#617087">Candidato de ejemplo · envío completo</text>
<rect x="1244" y="344" width="484" height="110" rx="12" fill="#FFF5EB" stroke="#E5C4A1" stroke-width="2"/>
