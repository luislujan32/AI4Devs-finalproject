<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
<title id="title">Screeningroom: configuración, cuestionario e informe</title>
<desc id="desc">Bocetos del MVP con datos ficticios. El candidato completa el cuestionario y el recruiter puede continuar pese a un requisito excluyente incumplido.</desc>
<rect width="1800" height="1160" fill="#F3F5F8"/>
<text x="48" y="74" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#273449">Screeningroom</text>
<text x="48" y="111" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#617087">Bocetos del MVP · estructura prevista · datos ficticios · no es una aplicación implementada</text>
<text x="48" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#273449">01  Preparar screening</text>
<text x="48" y="207" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#617087">Vista del recruiter</text>
