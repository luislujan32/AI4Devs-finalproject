<text x="634" y="207" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#617087">Vista del candidato · móvil</text>
<rect x="634" y="227" width="532" height="828" rx="12" fill="#FFFFFF" stroke="#D8DFE8" stroke-width="2"/>
